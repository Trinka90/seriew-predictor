name: Pubblica interfaccia

# Quando cambia solo la grafica (docs/index.html) la pubblica subito, senza ricalcolare i pronostici
on:
  push:
    branches: [main]
    paths: ["docs/index.html"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
