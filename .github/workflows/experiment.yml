name: Esperimento modello

on:
  push:
    branches: [main]
    paths: ["engine/experiment.py", "engine/probe.py", "engine/ai_test.py", "experiments/*.py", ".github/workflows/experiment.yml"]

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - run: pip install openpyxl
      - name: Prova fonti
        if: contains(github.event.head_commit.message, '[fonti]')
        working-directory: engine
        run: python probe.py
        continue-on-error: true
      - name: Prova fornitori IA
        if: contains(github.event.head_commit.message, '[ia]')
        working-directory: engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_test.py
      - name: Scarica storico
        if: contains(github.event.head_commit.message, '[esperimento]') || contains(github.event.head_commit.message, '[backtest]') || contains(github.event.head_commit.message, '[semaforo]') || contains(github.event.head_commit.message, '[arena]')
        working-directory: engine
        run: python -c "import data_sources as D; D.update_history()"
      - name: Esperimento
        if: contains(github.event.head_commit.message, '[esperimento]')
        working-directory: engine
        run: python experiment.py
      - name: Simulazione stagione (come usare l'app)
        if: contains(github.event.head_commit.message, '[backtest]')
        working-directory: engine
        run: python ../experiments/backtest_app.py
      - name: Backtest semaforo e pronostico robusto
        if: contains(github.event.head_commit.message, '[semaforo]')
        working-directory: engine
        run: python ../experiments/backtest_semaforo.py
      - name: Arena dei modelli
        if: contains(github.event.head_commit.message, '[arena]')
        working-directory: engine
        run: |
          pip install -q scikit-learn
          if echo "${{ github.event.head_commit.message }}" | grep -q "\[arena2425\]"; then
            ARENA_TUNE=2324 ARENA_TEST=2425 python ../experiments/arena.py
          else
            python ../experiments/arena.py
          fi
      - name: Backtest tennis e NBA (quote storiche)
        if: contains(github.event.head_commit.message, '[sport]')
        working-directory: engine
        run: |
          pip install -q xlrd
          python ../experiments/backtest_sport.py
      - name: Sonda ESPN
        if: contains(github.event.head_commit.message, '[espn]')
        run: python experiments/probe_espn.py
        continue-on-error: true
      - name: Salva risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments
          git commit -m "Risultati esperimento modello" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 10; done
