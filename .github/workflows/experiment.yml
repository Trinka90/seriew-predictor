name: Esperimento modello

on:
  push:
    branches: [main]
    paths: ["engine/experiment.py", ".github/workflows/experiment.yml"]

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Scarica storico
        working-directory: engine
        run: python -c "import data_sources as D; D.update_history()"
      - name: Esperimento
        working-directory: engine
        run: python experiment.py
      - name: Salva risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments
          git commit -m "Risultati esperimento modello" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
