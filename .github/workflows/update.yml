name: Aggiorna pronostici

on:
  schedule:
    - cron: "17 5,10,16 * * *"     # 3 volte al giorno (~6:17, 11:17, 17:17 ora italiana)
    - cron: "47 11,13,17,19 * * 0,6"  # sabato e domenica anche a ridosso delle partite (~12:47, 14:47, 18:47, 20:47)
    - cron: "47 13,18 * * 1-5"         # giorni feriali: anche ~14:47 e ~19:47 (partite serali, quote a ridosso)
    - cron: "37 * * * *"               # recupero: ogni ora controlla se un giro previsto è saltato (GitHub a volte li salta)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Europe/Rome

jobs:
  # GitHub a volte salta o ritarda di molto i giri programmati. Ogni ora un controllo: se l'ultimo giro previsto
  # non c'è stato (dati più vecchi dell'orario previsto) lo recupera, altrimenti non fa niente.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: docs/data/meta.json
          sparse-checkout-cone-mode: false
      - id: c
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os
          ev = os.environ.get("EV")
          if ev != "schedule":
              print("go=true"); raise SystemExit
          now = dt.datetime.now(dt.timezone.utc)
          # orari previsti in UTC (gli stessi delle righe cron qui sopra)
          slots = []
          for d in (now.date() - dt.timedelta(days=1), now.date()):
              wd = d.weekday()   # 0 = lunedì
              hm = [(5, 17), (10, 17), (16, 17)] + ([(11, 47), (13, 47), (17, 47), (19, 47)] if wd >= 5 else [(13, 47), (18, 47)])
              slots += [dt.datetime(d.year, d.month, d.day, h, m, tzinfo=dt.timezone.utc) for h, m in hm]
          due = max(s for s in slots if s <= now)
          try:
              last = dt.datetime.fromisoformat(json.load(open("docs/data/meta.json"))["aggiornato"])
          except Exception:
              last = dt.datetime(2000, 1, 1, tzinfo=dt.timezone.utc)
          print("go=" + ("true" if last < due else "false"))
          PY
        env:
          EV: ${{ github.event_name }}

  update:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # sempre l'ultima versione, anche se il giro era in coda

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: Scarica dati e calcola pronostici
        working-directory: engine
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BT=""
          # backtest il lunedì e nei lanci manuali
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" != "schedule" ]; then BT="--backtest"; fi
          # tempo massimo 45 minuti; in caso di problemi restano i dati precedenti e si pubblica comunque
          timeout 45m python export_json.py $BT || echo "::warning::aggiornamento incompleto, tengo i dati precedenti"

      - name: Salva i dati nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data; if [ -d engine/cache ]; then git add engine/cache; fi
          git diff --cached --quiet || (git commit -m "Dati aggiornati $(date +'%Y-%m-%d %H:%M')" && \
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 10; done)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
