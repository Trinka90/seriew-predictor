name: Aggiorna pronostici

on:
  schedule:
    - cron: "17 5,10,16 * * *"     # 3 volte al giorno (~6:17, 11:17, 17:17 ora italiana)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "docs/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Europe/Rome

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: Scarica dati e calcola pronostici
        working-directory: engine
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BT=""
          # backtest il lunedì e nei lanci manuali
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" != "schedule" ]; then BT="--backtest"; fi
          python export_json.py $BT

      - name: Salva i dati nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data; if [ -d engine/cache ]; then git add engine/cache; fi
          git diff --cached --quiet || (git commit -m "Dati aggiornati $(date +'%Y-%m-%d %H:%M')" && \
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
