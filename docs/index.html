<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Pronostici</title>
<style>
:root{--bg:#0f1720;--card:#17212c;--card2:#1e2a37;--tx:#e8eef4;--mut:#8b9bab;--line:#263444;
--g:#2fbf71;--y:#e8b931;--r:#e5534b;--acc:#4da3ff;--h:#4da3ff;--d:#8b9bab;--a:#f08a4b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif}
body{padding-bottom:76px}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;font-size:14px;max-width:100%}
a{color:var(--acc)}
.mut{color:var(--mut)} .small{font-size:12px} .sp{flex:1}
.row{display:flex;align-items:center;gap:8px}

/* testata */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0}
.upd{font-size:11px;color:var(--mut)}
.bar-s{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.bar-s::-webkit-scrollbar{display:none}
.bar-s button{flex:none;border-radius:999px;padding:6px 12px}
.bar-s button.on{background:var(--acc);color:#0b1118;border-color:var(--acc);font-weight:600}
.bar-s button small{opacity:.7;margin-left:4px}

/* navigazione */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:9px 0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}
nav button.on{color:var(--acc);font-weight:600}

main{padding:12px 16px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 8px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}

/* righe pronostico */
.pk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.pk:first-of-type{border-top:0}
.pk .n{width:20px;flex:none;color:var(--mut);font-size:12px;text-align:center}
.pk .main{min-width:0;flex:1}
.pk .what{font-weight:600}
.pk .who{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .num{text-align:right;flex:none}
.pk .num b{font-size:18px;display:block;line-height:1.1}
.pk .num span{font-size:11px;color:var(--mut)}
.code{display:inline-block;border:1.5px solid var(--acc);color:var(--acc);font-weight:800;border-radius:7px;padding:1px 8px;margin-right:8px;font-size:15px;white-space:nowrap;vertical-align:middle}
.codebig{font-size:22px;padding:3px 12px;margin:0 0 4px}
.expl{font-size:13px;color:var(--tx);opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.d3{background:var(--g)} .d2{background:var(--y)} .d1{background:var(--r)}

/* schedina riassunto */
.big{font-size:30px;font-weight:700;line-height:1.1}
.sum{display:flex;align-items:flex-end;gap:10px}
.sum .r{margin-left:auto;text-align:right}
.verdict{font-size:13px;margin-top:4px}

/* partite per campionato */
.lgh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:600}
.lgh .c{color:var(--mut);font-weight:400;font-size:13px}
.lgh .ar{margin-left:auto;color:var(--mut)}
.grp{padding:0;overflow:hidden}
.mr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.mr .t{width:40px;flex:none;color:var(--mut);font-size:12px}
.mr .tm{flex:1;min-width:0}
.mr .tm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .pb{font-size:11px;color:var(--mut)}
.mr .bp{flex:none;text-align:right;font-size:12px;max-width:42%}
.mr .bp b{font-size:14px}

/* dettaglio partita */
#det{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding-bottom:30px}
#det.on{display:block}
.dh{position:sticky;top:0;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.teams{font-size:18px;font-weight:700;text-align:center;margin:6px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:12px}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:12px 0 3px;font-size:12px;font-weight:600}
.bar div{display:flex;align-items:center;justify-content:center;color:#0b1118;min-width:30px;white-space:nowrap}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.pick{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:12px}
.pick .p{margin-left:auto;text-align:right}
.pick .p b{font-size:20px;display:block}
.says{margin:10px 0 0;padding-left:18px;font-size:14px}
.says li{margin:3px 0}
details.acc{border-top:1px solid var(--line);padding:2px 0}
details.acc>summary{padding:10px 0;font-weight:600;cursor:pointer;list-style:none}
details.acc>summary::after{content:"▾";float:right;color:var(--mut)}
details.acc[open]>summary::after{content:"▴"}
.sec{margin:10px 0 2px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mk{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mk span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.news a{color:var(--tx);text-decoration:none;display:block;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--card2);color:var(--y);margin-right:4px}
.form{display:inline-flex;gap:2px;vertical-align:middle}
.form i{width:14px;height:14px;border-radius:3px;font-size:9px;font-style:normal;display:flex;align-items:center;justify-content:center;color:#0b1118;font-weight:700}
.V{background:var(--g)}.N{background:var(--y)}.P{background:var(--r)}
.conf{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.c3{background:#123a24;color:var(--g)}.c2{background:#3a3212;color:var(--y)}.c1{background:#3a1a18;color:var(--r)}

/* controlli schedina */
.ctl{display:flex;align-items:center;gap:10px;padding:8px 0}
.ctl .l{flex:1;font-size:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;padding:6px 0;font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button.on,.chips button.on{background:var(--acc);color:#0b1118;border-color:var(--acc);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chips button{border-radius:999px;padding:5px 10px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.add{padding:4px 10px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500;font-size:11px}
td:nth-child(2),th:nth-child(2){text-align:left}
.fz{display:inline-block;height:6px;background:var(--acc);border-radius:3px;vertical-align:middle}
.banner{background:#123a24;border:1px solid var(--g);border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.gl dt{font-weight:600;margin-top:8px}
.gl dd{margin:0;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="row"><h1>Pronostici</h1><span class="sp"></span><span class="upd" id="upd"></span><button id="reload" title="Aggiorna">↻</button></div>
  <div class="bar-s" id="sports"></div>
  <div class="bar-s" id="days"></div>
</header>
<main id="main"></main>
<div id="det"></div>
<nav>
  <button data-v="oggi" class="on"><span>🏠</span>Oggi</button>
  <button data-v="schedina"><span>🎫</span>Schedina</button>
  <button data-v="classifica"><span>📊</span>Classifiche</button>
  <button data-v="info"><span>ℹ️</span>Guida</button>
</nav>
<script>
const REPO = "Trinka90/seriew-predictor";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc = p => p == null ? "–" : Math.round(p * 100) + "%";
const fair = p => p > 0 ? (1 / p).toFixed(2) : "–";
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const restore = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };

const F0 = {pmin: 0.65, qmin: 1.2, cats: ["esito", "doppia", "gol", "ggng", "multigol", "set", "punti", "handicap"],
            leghe: [], soloQuote: false, n: 4, obiettivo: "prob", target: 3};
const S = {view: "oggi", pred: null, stand: null, meta: null, err: null, appUpdate: null,
           sport: restore("sport", "tutti"), day: null, allDays: false, f: {...F0, ...restore("filtri2", {})},
           sel: null, open: {}, showAll: false, lgClass: null};
S.lega = "ALL";   // usato da alcune funzioni condivise
const LEGHE = () => S.pred?.leghe || {};
const lgName = c => LEGHE()[c] ? `${LEGHE()[c].flag} ${LEGHE()[c].nome}` : c;
const sportOf = m => m.sport || "calcio";
const SPORTS = {calcio: "⚽ Calcio", tennis: "🎾 Tennis", basket: "🏀 Basket"};
const form = f => `<span class="form">${[...(f || "")].map(c => `<i class="${c}">${c}</i>`).join("")}</span>`;
const pos = c => c ? `${c.pos}° in classifica` : "neopromossa";
const todayStr = () => new Date().toISOString().slice(0, 10);
function dayShort(d) {
  const dd = new Date(d + "T12:00"), tm = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  return d === todayStr() ? "Oggi" : d === tm ? "Domani" : `${GIORNI[dd.getDay()].slice(0, 3)} ${dd.getDate()}`;
}
const dayLabel = s => { const d = new Date(s + "T12:00"); return `${GIORNI[d.getDay()]} ${d.toLocaleDateString("it-IT", {day: "numeric", month: "long"})}`; };

/* ---------- traduzione dei mercati in parole semplici ---------- */
function label(k, m) {
  const c = m.casa, o = m.ospite;
  const L = {
    "1": `Vince ${c}`, "X": "Pareggio", "2": `Vince ${o}`,
    "1X": `${c} vince o pareggia`, "X2": `${o} vince o pareggia`, "12": "Vince una delle due (niente pareggio)",
    "DNB 1": `${c} vince (rimborso se pari)`, "DNB 2": `${o} vince (rimborso se pari)`,
    "Handicap 1 (-1)": `${c} vince con 2+ gol di scarto`, "Handicap 2 (-1)": `${o} vince con 2+ gol di scarto`,
    "Over 0.5": "Almeno 1 gol", "Over 1.5": "Almeno 2 gol", "Over 2.5": "Almeno 3 gol",
    "Over 3.5": "Almeno 4 gol", "Over 4.5": "Almeno 5 gol",
    "Under 0.5": "Nessun gol", "Under 1.5": "Massimo 1 gol", "Under 2.5": "Massimo 2 gol",
    "Under 3.5": "Massimo 3 gol", "Under 4.5": "Massimo 4 gol",
    "GG": "Segnano entrambe", "NG": "Almeno una non segna",
    "Casa Over 0.5": `${c} segna`, "Casa Over 1.5": `${c} segna 2+ gol`,
    "Ospite Over 0.5": `${o} segna`, "Ospite Over 1.5": `${o} segna 2+ gol`,
    "1 + Over 1.5": `Vince ${c} e almeno 2 gol`, "2 + Over 1.5": `Vince ${o} e almeno 2 gol`,
    "1 + GG": `Vince ${c} e segnano entrambe`, "2 + GG": `Vince ${o} e segnano entrambe`,
    "GG + Over 2.5": "Segnano entrambe e almeno 3 gol",
    "1X + Under 3.5": `${c} non perde e max 3 gol`, "X2 + Under 3.5": `${o} non perde e max 3 gol`,
    "Pari": "Totale gol pari", "Dispari": "Totale gol dispari",
    "1T 1": `${c} avanti all'intervallo`, "1T X": "Pari all'intervallo", "1T 2": `${o} avanti all'intervallo`,
    "1T Over 0.5": "Almeno 1 gol nel 1° tempo", "1T Over 1.5": "Almeno 2 gol nel 1° tempo", "1T GG": "Segnano entrambe nel 1° tempo",
  };
  if (m.sport === "tennis") {
    const T = {"1": `Vince ${c}`, "2": `Vince ${o}`, "1 vince un set": `${c} vince almeno un set`, "2 vince un set": `${o} vince almeno un set`,
      "Set Over 2.5": "Si gioca il 3° set", "Set Over 3.5": "Si giocano almeno 4 set", "Set Over 4.5": "Si arriva al 5° set"};
    if (T[k]) return T[k];
    const r = k.match(/^Set (\d)-(\d)$/);
    if (r) return +r[1] > +r[2] ? `${c} vince ${r[1]}-${r[2]}` : `${o} vince ${r[2]}-${r[1]}`;
    return k;
  }
  if (m.sport === "basket") {
    let r;
    if (k === "1") return `Vince ${c}`;
    if (k === "2") return `Vince ${o}`;
    if ((r = k.match(/^(Over|Under) ([\d.]+) punti$/))) return `${r[1] === "Over" ? "Più" : "Meno"} di ${r[2]} punti totali`;
    if ((r = k.match(/^Handicap (casa|ospite) ([+-][\d.]+)$/))) {
      const t = r[1] === "casa" ? c : o, v = +r[2];
      return v < 0 ? `${t} vince con ${Math.ceil(-v)}+ punti di scarto` : `${t} vince o perde di massimo ${Math.floor(v)} punti`;
    }
    if ((r = k.match(/^(Casa|Ospite) vince di (\d+)\+$/))) return `${r[1] === "Casa" ? c : o} vince con ${r[2]}+ punti di scarto`;
    return k;
  }
  if (L[k]) return L[k];
  let r;
  if ((r = k.match(/^Multigol (\d)-(\d)$/))) return `Da ${r[1]} a ${r[2]} gol totali`;
  if ((r = k.match(/^PF (.)\/(.)$/))) { const t = x => x === "1" ? c : x === "2" ? o : "pari"; return `Intervallo ${t(r[1])}, finale ${t(r[2])}`; }
  if ((r = k.match(/^(Angoli|Cartellini) Over ([\d.]+)$/))) return `Più di ${Math.floor(+r[2])} ${r[1].toLowerCase()}`;
  return k;
}

/* ---------- pronostici giocabili di ogni partita, con categoria ---------- */
const CATS = {esito: "Vincente / 1X2", doppia: "Doppia chance", gol: "Over/Under gol", ggng: "Gol/NoGol",
              multigol: "Multigol", combo: "Combinati", set: "Set (tennis)", punti: "Punti (basket)", handicap: "Handicap"};
function catOf(k, m) {
  if (m.sport === "tennis") return (k === "1" || k === "2") ? "esito" : "set";
  if (m.sport === "basket") return (k === "1" || k === "2") ? "esito" : /punti$/.test(k) ? "punti" : "handicap";
  if (["1", "X", "2"].includes(k)) return "esito";
  if (["1X", "X2", "12"].includes(k)) return "doppia";
  if (/^(Over|Under) [1-4]\.5$/.test(k)) return "gol";
  if (k === "GG" || k === "NG") return "ggng";
  if (/^Multigol/.test(k)) return "multigol";
  if (/ \+ /.test(k)) return "combo";
  return null;
}
const CALCIO_KEYS = ["1", "X", "2", "1X", "X2", "12", "Over 1.5", "Over 2.5", "Over 3.5", "Under 1.5", "Under 2.5", "Under 3.5",
  "GG", "NG", "Multigol 1-3", "Multigol 2-4", "Multigol 2-3", "1 + Over 1.5", "2 + Over 1.5", "1 + GG", "2 + GG", "GG + Over 2.5"];
function picksFor(m, mi) {
  const keys = (!m.sport || m.sport === "calcio") ? CALCIO_KEYS : Object.keys(m.mercati);
  return keys.filter(k => m.mercati[k] != null && catOf(k, m)).map(k => {
    const p = m.mercati[k], real = m.quote?.[k] || null, est = real ? null : (m.quote_stimate?.[k] || null);
    const q = real || est;
    return {id: `${mi}|${k}`, mi, m, k, p, cat: catOf(k, m), q, est: !!est, bk: q ? (m.bookmaker || "Bet365") : null, odd: q || 1 / p};
  });
}
/* il pronostico consigliato = il più probabile tra quelli che pagano almeno la quota minima */
function bestPick(m) {
  const qmin = (typeof S !== "undefined" && S.f) ? S.f.qmin : 1.2;
  const all = picksFor(m, 0).sort((a, b) => b.p - a.p);
  return all.find(x => x.odd >= qmin) || all[all.length - 1];
}
/* codice della scommessa come sulla schedina del bookmaker */
function codeOf(k, m) {
  let r;
  if (m.sport === "tennis") {
    if (k === "1" || k === "2") return k;
    if ((r = k.match(/^Set (\d-\d)$/))) return r[1];
    if ((r = k.match(/^([12]) vince un set$/))) return `${r[1]} +1 set`;
    if ((r = k.match(/^Set Over ([\d.]+)$/))) return `Over ${r[1]} set`;
    return k;
  }
  if (m.sport === "basket") {
    if ((r = k.match(/^(Over|Under) ([\d.]+) punti$/))) return `${r[1]} ${r[2]}`;
    if ((r = k.match(/^Handicap (casa|ospite) ([+-][\d.]+)$/))) return `${r[1] === "casa" ? 1 : 2} (${r[2]})`;
    if ((r = k.match(/^(Casa|Ospite) vince di (\d+)\+$/))) return `${r[1] === "Casa" ? 1 : 2} +${r[2]} pt`;
    return k;
  }
  const C = {"Casa Over 0.5": "Casa segna", "Ospite Over 0.5": "Ospite segna", "Casa Over 1.5": "Casa Over 1.5",
             "Ospite Over 1.5": "Ospite Over 1.5", "Handicap 1 (-1)": "1 (-1)", "Handicap 2 (-1)": "2 (-1)"};
  return C[k] || k.replace("Multigol ", "MG ");
}
function conf(p) { return p >= .8 ? ["c3", "Fiducia alta"] : p >= .7 ? ["c2", "Fiducia media"] : ["c1", "Fiducia bassa"]; }

/* frasi semplici sulla partita */
function storySport(m) {
  const M = m.mercati, out = [];
  const fav = M["1"] >= M["2"] ? [m.casa, M["1"]] : [m.ospite, M["2"]];
  out.push(fav[1] >= .75 ? `<b>${esc(fav[0])}</b> nettamente favorito (${pc(fav[1])}).` : fav[1] >= .6 ? `<b>${esc(fav[0])}</b> favorito (${pc(fav[1])}).` : `Partita <b>equilibrata</b>.`);
  if (m.sport === "tennis") {
    out.push(`🎾 ${esc(m.torneo)} · ${esc(m.turno)} · ${esc(m.superficie)}${m.bo5 ? " · al meglio dei 5 set" : ""}.`);
    out.push(`Rating Elo: ${esc(m.casa)} ${m.elo_casa} · ${esc(m.ospite)} ${m.elo_ospite}.`);
    if (m.pochi_dati) out.push(`⚠️ Pochi dati su uno dei due giocatori: pronostico meno affidabile.`);
  }
  if (m.sport === "basket") {
    out.push(`🏀 Punti attesi: ${esc(m.casa)} ${m.punti_casa} · ${esc(m.ospite)} ${m.punti_ospite}.`);
    if (m.con_mercato) out.push(`📈 Pronostico combinato con le quote dei bookmaker.`);
  }
  if (m.value.length) out.push(`💰 Quota conveniente: <b>${esc(label(m.value[0].mercato, m))}</b> pagata ${m.value[0].quota.toFixed(2)} (giusta ${fair(m.value[0].prob)}).`);
  return out;
}

function story(m) {
  const M = m.mercati, out = [];
  if (M["1"] >= .55) out.push(`<b>${esc(m.casa)}</b> è favorita (${pc(M["1"])} di vincere).`);
  else if (M["2"] >= .55) out.push(`<b>${esc(m.ospite)}</b> è favorita anche in trasferta (${pc(M["2"])}).`);
  else if (Math.abs(M["1"] - M["2"]) < .1) out.push(`Partita <b>equilibrata</b>: nessuna delle due è nettamente favorita.`);
  else out.push(`Leggermente avanti <b>${esc(M["1"] > M["2"] ? m.casa : m.ospite)}</b>, ma il pareggio è possibile (${pc(M["X"])}).`);
  const g = m.gol_casa + m.gol_ospite;

function autoBuild(cands, f) {
  const best = bestPerMatch(cands);
  if (f.obiettivo === "prob") return best.slice(0, f.n);
  // obiettivo quota: il minor numero di partite che raggiunge la quota (meno partite = meno margine del bookmaker)
  for (let k = 1; k <= f.n; k++) {
    const need = Math.pow(f.target, 1 / k);   // quota che serve in media a ogni pronostico
    const per = {};
    for (const x of cands) if (x.odd >= need && (!per[x.mi] || x.p > per[x.mi].p)) per[x.mi] = x;
    const pick = Object.values(per).sort((a, b) => b.p - a.p).slice(0, k);
    if (pick.length === k) return pick;
  }
  // ultima possibilità: i pronostici più probabili finché la quota basta
  const out = [];
  let q = 1;
  for (const x of best) { if (out.length >= f.n || q >= f.target) break; out.push(x); q *= x.odd; }
  return q >= f.target ? out : null;
}

    p >= .1 ? `Difficile: esce circa 1 volta su ${Math.round(1 / p)}.` :
    `Molto difficile, quasi una lotteria: 1 volta su ${Math.round(1 / p)}.`;
}

function slipOdds(list) {
  const bks = new Set(list.map(x => x.bk));
  if (list.length && list.every(x => x.q) && bks.size === 1) {
    const b = [...bks][0], ne = list.filter(x => x.est).length;
    return {odd: list.reduce((a, x) => a * x.q, 1), real: !ne, label: `quota ${bkShort(b)}${ne ? " (≈ stimata)" : ""}`,
            note: ne ? `≈ = quota Bet365 stimata per ${ne} pronostic${ne === 1 ? "o" : "i"} (nei dati Bet365 ha solo 1X2 e Over/Under 2.5): calcolata con il margine che Bet365 applica a quella partita. Controlla la quota vera sul sito prima di giocare.` : ""};
  }
  const miss = list.filter(x => !x.q).length;
  return {odd: list.reduce((a, x) => a * (1 / x.p), 1), real: false, label: "quota giusta (stima)",
          note: bks.size > 2 || (bks.size === 2 && !bks.has(null))

}

      ${sec("Primo tempo", ["1T 1", "1T X", "1T 2", "1T Over 0.5", "1T Over 1.5", ...pf])}
      <div class="sec">Risultato esatto</div>${(m.risultati || []).map(r => `<div class="mk"><span>${esc(r.r)}</span><span>${pc(r.p)}</span></div>`).join("")}
      ${M["Angoli attesi"] != null ? sec(`Angoli (attesi ${M["Angoli attesi"].toFixed(1)}) e cartellini (attesi ${M["Cartellini attesi"].toFixed(1)})`, ["Angoli Over 8.5", "Angoli Over 9.5", "Angoli Over 10.5", "Cartellini Over 3.5", "Cartellini Over 4.5"]) : ""}`
    : rows(m, Object.keys(M));
  return `<div class="dh"><button onclick="closeMatch()">← Indietro</button><span class="small mut">${lgName(m.lega)} · ${dayShort(m.data)} ${esc(m.ora || "")}</span></div>
  <main>
    <div class="teams">${esc(m.casa)} – ${esc(m.ospite)}</div>
    <div class="sub">${calcio ? `${pos(m.classifica_casa)} ${form(m.forma_casa)} · ${pos(m.classifica_ospite)} ${form(m.forma_ospite)}` : `${form(m.forma_casa)} · ${form(m.forma_ospite)}`}</div>
    <div class="bar">${bar}</div>
    <div class="barlab"><span>vince ${esc(m.casa)}</span>${calcio ? "<span>pareggio</span>" : ""}<span>vince ${esc(m.ospite)}</span></div>
    <div class="pick"><div><div class="small mut">Pronostico consigliato (il più probabile${S.f.qmin > 1 ? " con quota ≥ " + S.f.qmin.toFixed(2) : ""})</div>
      <span class="code codebig">${esc(codeOf(bp.k, m))}</span><div class="expl">${esc(label(bp.k, m))}</div><span class="conf ${cc}">${ct}</span></div>
      <div class="p"><b>${pc(bp.p)}</b><span class="small mut">${bp.q ? "quota " + esc(bkShort(bp.bk)) + " " + (bp.est ? "≈" : "") + bp.q.toFixed(2) : "quota giusta " + fair(bp.p)}</span></div></div>
    <ul class="says">${says.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="card" style="margin-top:14px;padding-top:2px;padding-bottom:2px">
      <details class="acc"><summary>Tutti i pronostici</summary>${altri}</details>
      ${calcio ? `<details class="acc"><summary>Assenti e notizie</summary>
        <div class="sec">Assenti ${esc(m.casa)}</div>${abs(m.assenti_casa || [])}
        <div class="sec">Assenti ${esc(m.ospite)}</div>${abs(m.assenti_ospite || [])}
        <div class="sec">Notizie ${esc(m.casa)}</div><div class="news">${newsList(m.news_casa)}</div>
        <div class="sec">Notizie ${esc(m.ospite)}</div><div class="news">${newsList(m.news_ospite)}</div></details>` : ""}
    </div>
  </main>`;
}

/* ---------- 🎫 SCHEDINA ---------- */
function viewSchedina() {
  const f = S.f, list = matchesNow();
  const cands = picks(list, f);
  if (!S.sel) { const a = autoBuild(cands, f); S.sel = a ? a.map(x => x.id) : []; S.autoFail = !a; }
  const byId = Object.fromEntries(cands.map(x => [x.id, x]));
  const chosen = S.sel.map(id => byId[id]).filter(Boolean);
  const used = new Set(chosen.map(x => x.mi));
  const others = bestPerMatch(cands.filter(x => !used.has(x.mi))).slice(0, 15);
  const p = chosen.reduce((a, x) => a * x.p, 1), n = chosen.length;
  const sl = slipOdds(chosen), odd = sl.odd, allReal = sl.real;
  const L = LEGHE();
  const lgs = Object.keys(L).filter(c => S.sport === "tutti" || L[c].sport === S.sport);
  return updBanner() + `
  <div class="card">
    <div class="seg"><button class="${f.obiettivo === "prob" ? "on" : ""}" onclick="setF('obiettivo','prob')">La più sicura</button>
      <button class="${f.obiettivo === "quota" ? "on" : ""}" onclick="setF('obiettivo','quota')">Voglio una quota</button></div>
    <div class="ctl"><span class="l">${f.obiettivo === "prob" ? "Quante partite" : "Massimo partite"}</span>
      <div class="step"><button onclick="setF('n', Math.max(1, S.f.n - 1))">−</button><b>${f.n}</b><button onclick="setF('n', Math.min(12, S.f.n + 1))">+</button></div></div>
    ${f.obiettivo === "quota" ? `<div class="ctl"><span class="l">Quota da raggiungere</span>
      <select onchange="setF('target', +this.value)">${[1.5, 2, 2.5, 3, 4, 5, 7, 10, 15, 20].map(q => `<option value="${q}" ${f.target === q ? "selected" : ""}>${q}</option>`).join("")}</select></div>` : ""}
    <div class="ctl" style="display:block"><div class="row"><span class="l">Sicurezza minima di ogni pronostico</span><b>${pc(f.pmin)}</b></div>
      <input type="range" min="50" max="95" step="5" value="${Math.round(f.pmin * 100)}" onchange="setF('pmin', this.value/100)"></div>
    <details class="acc"><summary>Filtri avanzati</summary>
      <div class="small mut">Quota minima di ogni pronostico (scarta quelli che pagano troppo poco)</div>
      <div class="chips">${[1, 1.15, 1.2, 1.3, 1.5, 1.7, 2].map(q => `<button class="${f.qmin === q ? "on" : ""}" onclick="setF('qmin',${q})">${q === 1 ? "nessuna" : q.toFixed(2)}</button>`).join("")}</div>
      <div class="small mut">Tipi di pronostico</div>
      <div class="chips">${Object.entries(CATS).filter(([c]) => S.sport === "tutti" || {calcio: ["esito", "doppia", "gol", "ggng", "multigol", "combo"], tennis: ["esito", "set"], basket: ["esito", "punti", "handicap"]}[S.sport].includes(c))
        .map(([c, t]) => `<button class="${f.cats.includes(c) ? "on" : ""}" onclick="togF('cats','${c}')">${t}</button>`).join("")}</div>
      <div class="small mut">Campionati ${f.leghe.length ? `· <a href="#" onclick="setF('leghe',[]);return false">tutti</a>` : "(tutti)"}</div>
      <div class="chips">${lgs.map(c => `<button class="${f.leghe.includes(c) ? "on" : ""}" onclick="togF('leghe','${c}')">${lgName(c)}</button>`).join("")}</div>
      <label class="small"><input type="checkbox" ${f.soloQuote ? "checked" : ""} onchange="setF('soloQuote', this.checked)"> Solo pronostici con quota Bet365 (reale o stimata ≈)</label>
      <div style="margin:10px 0"><button onclick="S.f={...F0};store('filtri2',S.f);S.sel=null;render()">Ripristina impostazioni</button></div>
    </details>
  </div>
  ${S.autoFail && f.obiettivo === "quota" ? `<div class="banner" style="background:#3a3212;border-color:var(--y)">Non si arriva a quota ${f.target} con ${f.n} partite e questi filtri: aumenta le partite o abbassa la sicurezza minima.</div>` : ""}
  <div class="card">
    <div class="sum"><div><div class="small mut">Probabilità che esca</div><div class="big">${n ? pc(p) : "–"}</div></div>
      <div class="r"><div class="small mut">${n} pronostici · ${sl.label}</div><div class="big">${n ? odd.toFixed(2) : "–"}</div></div></div>
    ${n && sl.note ? `<div class="small mut" style="margin-top:4px">${esc(sl.note)}</div>` : ""}
    <div class="verdict">${verdict(p, n)}</div>
    ${chosen.map(x => pkRow(x, null, `<button class="x" onclick="event.stopPropagation();S.sel=S.sel.filter(i=>i!=='${x.id}');render()" title="Togli">✕</button>`)).join("")}
  </div>
  ${others.length ? `<div class="card"><details class="acc" style="border:0"><summary>➕ Aggiungi altri pronostici (${others.length})</summary>
    ${others.map(x => pkRow(x, null, `<button class="add" onclick="event.stopPropagation();S.sel.push('${x.id}');render()">＋</button>`)).join("")}</details></div>` : ""}
  <p class="small mut">Le probabilità si moltiplicano: 4 pronostici all'80% danno insieme il 41%. "Quota giusta" = senza guadagno del banco. Ogni pronostico in più aggiunge il margine del bookmaker (circa 5%). Gioca solo cifre che puoi permetterti di perdere.</p>`;
}

/* ---------- 📊 CLASSIFICHE ---------- */
function viewClassifica() {
  const L = LEGHE();
  const lgs = Object.keys(L).filter(c => S.stand?.leghe?.[c] && (S.sport === "tutti" || L[c].sport === S.sport));
  if (!lgs.length) return `<div class="empty">Classifiche non disponibili</div>`;
  if (!lgs.includes(S.lgClass)) S.lgClass = lgs[0];
  const cur = S.lgClass, r = S.stand.leghe[cur], sp = L[cur].sport !== "calcio";
  const mx = Math.max(...r.map(x => x.forza ?? 0)), mn = Math.min(...r.map(x => x.forza ?? 0));
  return `<div class="card"><select onchange="S.lgClass=this.value;render()" style="width:100%">${lgs.map(c => `<option value="${c}" ${c === cur ? "selected" : ""}>${lgName(c)}</option>`).join("")}</select></div>
  <div class="card"><table><tr><th>#</th><th>${L[cur].sport === "tennis" ? "Giocatore" : "Squadra"}</th><th>${sp ? "Elo" : "Punti"}</th><th>${sp ? "Partite" : "Gioc."}</th><th>Ultime 5</th><th>Forza</th></tr>${r.map(x =>
    `<tr><td>${x.pos}</td><td>${esc(x.squadra)}</td><td><b>${x.pt}</b></td><td>${x.pg}</td><td>${form(x.forma)}</td>
     <td><span class="fz" style="width:${x.forza == null ? 0 : 6 + 44 * (x.forza - mn) / ((mx - mn) || 1)}px"></span></td></tr>`).join("")}</table></div>
  <p class="mut small">V vittoria · N pareggio · P sconfitta. "Forza" è la valutazione del modello: tiene conto di contro chi si è giocato e dà più peso alle partite recenti.</p>`;
}

/* ---------- avvio ---------- */
async function getJSON(name) {
  const r = await fetch(`data/${name}?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}
async function load() {
  $("#upd").textContent = "…";
  try {
    [S.pred, S.stand, S.meta] = await Promise.all(["predictions.json", "standings.json", "meta.json"].map(getJSON));
    S.err = null;
    store("cache", [S.pred, S.stand, S.meta]);
  } catch (e) {
    S.err = e.message;
    [S.pred, S.stand, S.meta] = restore("cache", []) || [];
  }
  S.sel = null;
  const d = S.meta?.aggiornato ? new Date(S.meta.aggiornato) : null;
  $("#upd").textContent = d ? `agg. ${d.toLocaleTimeString("it-IT", {hour: "2-digit", minute: "2-digit"})}${S.err ? " · offline" : ""}` : "";
  render();
  checkApp();
}
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }
function render() {
  topBars();
  $("#main").innerHTML = {oggi: viewOggi, schedina: viewSchedina, classifica: viewClassifica, info: viewInfo}[S.view]();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
$("#reload").onclick = () => location.replace(location.pathname + "?t=" + Date.now());
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#det").classList.contains("on")) load(); });
load();
</script>
</body>
</html>
