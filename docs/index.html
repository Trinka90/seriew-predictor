<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Pronostici Serie A</title>
<style>
:root{--bg:#0f1720;--card:#17212c;--card2:#1e2a37;--tx:#e8eef4;--mut:#8b9bab;--line:#263444;
--g:#2fbf71;--y:#e8b931;--r:#e5534b;--acc:#4da3ff;--h:#4da3ff;--d:#8b9bab;--a:#f08a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.sub{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:600}
main{padding:12px 16px}
.day{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.tm b{display:block;font-size:16px}
.tm small{color:var(--mut);font-size:11px}
.tm.r{text-align:right}
.time{color:var(--mut);font-size:12px;text-align:center}
.xg{font-size:12px;color:var(--mut);text-align:center}
.bar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:10px 0 4px;font-size:12px;font-weight:600}
.bar div{display:flex;align-items:center;justify-content:center;color:#0b1118;min-width:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px}
.chip.v{border-color:var(--g);color:var(--g)}
.form{display:inline-flex;gap:2px;margin-top:2px}
.form i{width:14px;height:14px;border-radius:3px;font-size:9px;font-style:normal;display:flex;align-items:center;justify-content:center;color:#0b1118;font-weight:700}
.V{background:var(--g)}.N{background:var(--y)}.P{background:var(--r)}
.det{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.card.open .det{display:block}
.sec{margin:10px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px}
.mk{display:flex;justify-content:space-between;background:var(--card2);border-radius:6px;padding:5px 8px;font-size:13px}
.mk span:last-child{font-variant-numeric:tabular-nums}
.mk .q{color:var(--mut);font-size:11px;margin-left:4px}
.hi{outline:1px solid var(--g)}
.news a{color:var(--tx);text-decoration:none;display:block;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--card2);color:var(--y);margin-right:4px}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500;font-size:11px}
td:nth-child(2),th:nth-child(2){text-align:left}
.fz{display:inline-block;height:6px;background:var(--acc);border-radius:3px;vertical-align:middle}
.banner{background:#123a24;border:1px solid var(--g);border-radius:10px;padding:10px;margin-bottom:10px}
.banner a{color:var(--g);font-weight:600}
.warn{background:#3a2a12;border-color:var(--y)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header>
  <div class="row"><h1>Pronostici Serie A</h1><span class="sp"></span><button id="reload">↻ Aggiorna</button></div>
  <div class="sub" id="upd">caricamento…</div>
</header>
<main id="main"></main>
<nav>
  <button data-v="partite" class="on">Partite</button>
  <button data-v="classifica">Classifica</button>
  <button data-v="info">Info</button>
</nav>
<script>
const REPO = "Trinka90/seriew-predictor";
const S = {view: "partite", pred: null, stand: null, meta: null, onlyValue: false, err: null, appUpdate: null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc = p => p == null ? "–" : (p * 100).toFixed(0) + "%";
const fair = p => p > 0 ? (1 / p).toFixed(2) : "–";
const GIORNI = ["dom","lun","mar","mer","gio","ven","sab"];

async function getJSON(name) {
  const r = await fetch(`data/${name}?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}

async function load() {
  $("#upd").textContent = "caricamento…";
  try {
    [S.pred, S.stand, S.meta] = await Promise.all(["predictions.json", "standings.json", "meta.json"].map(getJSON));
    S.err = null;
    try { localStorage.setItem("cache", JSON.stringify([S.pred, S.stand, S.meta])); } catch (e) {}
  } catch (e) {
    S.err = e.message;
    try { [S.pred, S.stand, S.meta] = JSON.parse(localStorage.getItem("cache")) || []; } catch (_) {}
  }
  const d = S.meta?.aggiornato ? new Date(S.meta.aggiornato) : null;
  $("#upd").textContent = d ? `Dati aggiornati ${d.toLocaleString("it-IT", {dateStyle: "short", timeStyle: "short"})}` + (S.err ? " · offline" : "") : (S.err || "");
  render();
  checkApp();
}

function form(f) { return `<span class="form">${[...(f || "")].map(c => `<i class="${c}">${c}</i>`).join("")}</span>`; }
function pos(c) { return c ? `${c.pos}° · ${c.pt} pt` : "neopromossa"; }

function mkCell(m, k, q) {
  const p = m.mercati[k]; if (p == null) return "";
  const val = q && p * q - 1 > 0.05;
  return `<div class="mk ${val ? "hi" : ""}"><span>${esc(k)}</span><span>${pc(p)}<span class="q">${q ? "@" + q.toFixed(2) : fair(p)}</span></span></div>`;
}
function section(t, m, keys) {
  const cells = keys.map(k => mkCell(m, k, m.quote[k])).join("");
  return cells ? `<div class="sec">${t}</div><div class="grid">${cells}</div>` : "";
}
function newsList(arr) {
  return (arr || []).map(n => `<a href="${esc(n.link)}" target="_blank" rel="noopener">${n.tag ? n.tag.split(",").map(t => `<span class="tag">${esc(t)}</span>`).join("") : ""}${esc(n.titolo)} <span class="mut">· ${esc(n.fonte)}</span></a>`).join("") || `<div class="mut">nessuna notizia</div>`;
}
function abs(arr) { return arr.length ? arr.map(a => `${esc(a.nome)} <span class="mut">(${esc(a.motivo)})</span>`).join(", ") : `<span class="mut">nessuno segnalato</span>`; }

function card(m, i) {
  const M = m.mercati;
  const top = Object.entries(M).filter(([k, p]) => p >= .6 && p <= .95 && !k.includes("attesi") && k !== "12")
    .sort((a, b) => b[1] - a[1]).slice(0, 4);
  const pf = Object.keys(M).filter(k => k.startsWith("PF ")).sort();
  return `<div class="card" id="c${i}">
  <div class="teams" onclick="toggle(${i})">
    <div class="tm"><b>${esc(m.casa)}</b><small>${pos(m.classifica_casa)}</small><br>${form(m.forma_casa)}</div>
    <div><div class="time">${esc(m.ora || "")}</div><div class="xg">${m.gol_casa.toFixed(2)} – ${m.gol_ospite.toFixed(2)}<br>gol attesi</div></div>
    <div class="tm r"><b>${esc(m.ospite)}</b><small>${pos(m.classifica_ospite)}</small><br>${form(m.forma_ospite)}</div>
  </div>
  <div class="bar" onclick="toggle(${i})">
    <div style="width:${M["1"] * 100}%;background:var(--h)">1 ${pc(M["1"])}</div>
    <div style="width:${M["X"] * 100}%;background:var(--d)">X ${pc(M["X"])}</div>
    <div style="width:${M["2"] * 100}%;background:var(--a)">2 ${pc(M["2"])}</div>
  </div>
  <div class="chips" onclick="toggle(${i})">
    <span class="chip">O2.5 ${pc(M["Over 2.5"])}</span><span class="chip">GG ${pc(M["GG"])}</span>
    <span class="chip">${esc(m.risultati[0].r)} ${pc(m.risultati[0].p)}</span>
    ${top.map(([k, p]) => `<span class="chip">${esc(k)} ${pc(p)}</span>`).join("")}
    ${m.value.map(v => `<span class="chip v">VALUE ${esc(v.mercato)} @${v.quota.toFixed(2)} (+${(v.edge * 100).toFixed(0)}%)</span>`).join("")}
  </div>
  <div class="det">
    ${section("Esito", m, ["1", "X", "2", "1X", "X2", "12", "DNB 1", "DNB 2", "Handicap 1 (-1)", "Handicap 2 (-1)"])}
    ${section("Gol", m, ["Over 0.5", "Over 1.5", "Over 2.5", "Over 3.5", "Over 4.5", "Under 1.5", "Under 2.5", "Under 3.5", "GG", "NG", "Casa Over 0.5", "Casa Over 1.5", "Ospite Over 0.5", "Ospite Over 1.5", "Pari", "Dispari"])}
    ${section("Multigol", m, ["Multigol 1-2", "Multigol 1-3", "Multigol 2-3", "Multigol 2-4", "Multigol 3-5"])}
    ${section("Combo", m, ["1 + Over 1.5", "2 + Over 1.5", "1 + GG", "2 + GG", "GG + Over 2.5", "1X + Under 3.5", "X2 + Under 3.5"])}
    ${section("Primo tempo", m, ["1T 1", "1T X", "1T 2", "1T Over 0.5", "1T Over 1.5", "1T GG"])}
    ${section("Parziale / Finale", m, pf)}
    <div class="sec">Risultati esatti</div><div class="grid">${m.risultati.map(r => `<div class="mk"><span>${esc(r.r)}</span><span>${pc(r.p)}<span class="q">${fair(r.p)}</span></span></div>`).join("")}</div>
    <div class="sec">Angoli · attesi ${M["Angoli attesi"].toFixed(1)}</div><div class="grid">${["Angoli Over 7.5", "Angoli Over 8.5", "Angoli Over 9.5", "Angoli Over 10.5", "Angoli Over 11.5"].map(k => mkCell(m, k)).join("")}</div>
    <div class="sec">Cartellini · attesi ${M["Cartellini attesi"].toFixed(1)}</div><div class="grid">${["Cartellini Over 2.5", "Cartellini Over 3.5", "Cartellini Over 4.5", "Cartellini Over 5.5"].map(k => mkCell(m, k)).join("")}</div>
    <div class="sec">Assenti</div>
    <div><b>${esc(m.casa)}:</b> ${abs(m.assenti_casa)}</div><div><b>${esc(m.ospite)}:</b> ${abs(m.assenti_ospite)}</div>
    ${(m.note_casa.length || m.note_ospite.length) ? `<div class="sec">Note</div><div>${m.note_casa.map(x => esc(m.casa + ": " + x)).concat(m.note_ospite.map(x => esc(m.ospite + ": " + x))).join("<br>")}</div>` : ""}
    <div class="sec">Notizie ${esc(m.casa)}</div><div class="news">${newsList(m.news_casa)}</div>
    <div class="sec">Notizie ${esc(m.ospite)}</div><div class="news">${newsList(m.news_ospite)}</div>
    <div class="mut" style="font-size:11px;margin-top:8px">Gol attesi modello puro ${m.gol_casa_base.toFixed(2)} – ${m.gol_ospite_base.toFixed(2)}, corretti per assenze/motivazioni. Percentuale e quota equa (o quota bookmaker con @).</div>
  </div></div>`;
}
function toggle(i) { document.getElementById("c" + i).classList.toggle("open"); }

function viewPartite() {
  const list = (S.pred?.partite || []).filter(m => !S.onlyValue || m.value.length);
  let h = updBanner() + `<label><input type="checkbox" ${S.onlyValue ? "checked" : ""} onchange="S.onlyValue=this.checked;render()"> solo partite con value</label>`;
  if (!list.length) return h + `<div class="empty">Nessuna partita nei prossimi 10 giorni${S.onlyValue ? " con value" : ""}.</div>`;
  let last = "";
  list.forEach((m, i) => {
    if (m.data !== last) {
      const d = new Date(m.data + "T12:00");
      h += `<div class="day">${GIORNI[d.getDay()]} ${d.toLocaleDateString("it-IT", {day: "numeric", month: "long"})}</div>`;
      last = m.data;
    }
    h += card(m, i);
  });
  return h;
}

function viewClassifica() {
  const r = S.stand?.righe || [];
  if (!r.length) return `<div class="empty">Classifica non disponibile</div>`;
  const mx = Math.max(...r.map(x => x.forza ?? 0)), mn = Math.min(...r.map(x => x.forza ?? 0));
  return `<table><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>DR</th><th>Forma</th><th>Forza</th></tr>${r.map(x =>
    `<tr><td>${x.pos}</td><td>${esc(x.squadra)}</td><td><b>${x.pt}</b></td><td>${x.pg}</td><td>${x.dr > 0 ? "+" : ""}${x.dr}</td><td>${form(x.forma)}</td>
     <td><span class="fz" style="width:${x.forza == null ? 0 : 6 + 44 * (x.forza - mn) / ((mx - mn) || 1)}px"></span></td></tr>`).join("")}</table>
    <p class="mut" style="font-size:12px">Forza = rating del modello (attacco − difesa), pesato sulle partite recenti: dice chi è più forte al di là dei punti.</p>`;
}

function viewInfo() {
  const m = S.meta || {}, b = m.backtest;
  const v = window.Android?.versionCode ? window.Android.versionCode() : null;
  return updBanner() + `<div class="card">
    <div class="sec">Dati</div>
    <div class="kv"><span>Partite in archivio</span><b>${m.partite_storico ?? "–"}</b></div>
    <div class="kv"><span>Ultima partita registrata</span><b>${m.ultima_partita ?? "–"}</b></div>
    <div class="kv"><span>Infortuni/allenatori (API-Football)</span><b>${m.api_football ? "attivo" : "non attivo"}</b></div>
    <div class="kv"><span>Versione app</span><b>${v ?? "web"}</b></div>
    ${S.err ? `<div class="kv"><span>Errore</span><b>${esc(S.err)}</b></div>` : ""}
  </div>
  ${b ? `<div class="card"><div class="sec">Affidabilità (backtest stagione ${esc(b.stagione)}, ${b.partite} partite)</div>
    <div class="kv"><span>LogLoss modello / bookmaker</span><b>${b.logloss_modello} / ${b.logloss_book}</b></div>
    <div class="kv"><span>Precisione 1X2 modello / bookmaker</span><b>${pc(b.acc_modello)} / ${pc(b.acc_book)}</b></div>
    <div class="kv"><span>Value bet simulate / ROI</span><b>${b.value_bet} / ${b.roi == null ? "–" : (b.roi * 100).toFixed(1) + "%"}</b></div>
    <p class="mut" style="font-size:12px">LogLoss più basso = previsioni migliori. Se il modello non batte il bookmaker, i "value" vanno presi con molta cautela.</p></div>` : ""}
  <div class="card"><div class="sec">Fonti</div><p style="font-size:13px">Risultati, statistiche e quote: football-data.co.uk · Calendario: football-data.co.uk, fixturedownload.com · Infortuni e allenatori: API-Football · Notizie: Google News, Gazzetta, Corriere dello Sport.</p>
  <p class="mut" style="font-size:12px">Strumento statistico personale. Nessun pronostico è sicuro. Il gioco è vietato ai minori e può causare dipendenza.</p></div>`;
}

function updBanner() {
  return S.appUpdate ? `<div class="banner">Nuova versione dell'app disponibile (${esc(S.appUpdate.tag)}). <a href="${esc(S.appUpdate.url)}">Scarica APK</a></div>` : "";
}

async function checkApp() {
  if (!window.Android?.versionCode || S.appUpdate) return;
  try {
    const r = await (await fetch(`https://api.github.com/repos/${REPO}/releases/latest`)).json();
    const latest = parseInt(String(r.tag_name || "").replace(/\D/g, "")) || 0;
    const apk = (r.assets || []).find(a => a.name.endsWith(".apk"));
    if (apk && latest > window.Android.versionCode()) { S.appUpdate = {tag: r.tag_name, url: apk.browser_download_url}; render(); }
  } catch (e) {}
}

function render() {
  $("#main").innerHTML = {partite: viewPartite, classifica: viewClassifica, info: viewInfo}[S.view]();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.view = b.dataset.v; render(); scrollTo(0, 0); });
$("#reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
