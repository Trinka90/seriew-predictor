<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Pronostici</title>
<style>
:root{--bg:#0f1720;--card:#17212c;--card2:#1e2a37;--tx:#e8eef4;--mut:#8b9bab;--line:#263444;
--g:#2fbf71;--y:#e8b931;--r:#e5534b;--acc:#4da3ff;--h:#4da3ff;--d:#8b9bab;--a:#f08a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
h2{font-size:16px;margin:4px 0 8px}
.sub{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:18px}
nav button.on{color:var(--acc);font-weight:600}
main{padding:12px 16px}
.day{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.teams{display:flex;align-items:center;gap:8px}
.teams b{font-size:16px}
.vs{color:var(--mut)}
.meta{color:var(--mut);font-size:12px;margin-top:2px}
.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:10px 0 2px;font-size:12px;font-weight:600}
.bar div{display:flex;align-items:center;justify-content:center;color:#0b1118;min-width:30px;white-space:nowrap}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.pick{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px;margin-top:10px}
.pick .t{font-weight:600}
.pick .p{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.pick .p b{font-size:18px;display:block}
.conf{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.c3{background:#123a24;color:var(--g)}.c2{background:#3a3212;color:var(--y)}.c1{background:#3a1a18;color:var(--r)}
.says{font-size:13px;margin-top:8px;color:var(--tx)}
.says li{margin:2px 0}
ul{margin:4px 0;padding-left:18px}
.form{display:inline-flex;gap:2px;vertical-align:middle}
.form i{width:14px;height:14px;border-radius:3px;font-size:9px;font-style:normal;display:flex;align-items:center;justify-content:center;color:#0b1118;font-weight:700}
.V{background:var(--g)}.N{background:var(--y)}.P{background:var(--r)}
.more{width:100%;margin-top:10px;background:none;color:var(--acc);border-color:var(--line)}
.det{display:none;margin-top:6px}
.card.open .det{display:block}
.sec{margin:12px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mk{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mk span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}
.small{font-size:12px}
.news a{color:var(--tx);text-decoration:none;display:block;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--card2);color:var(--y);margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500;font-size:11px}
td:nth-child(2),th:nth-child(2){text-align:left}
.fz{display:inline-block;height:6px;background:var(--acc);border-radius:3px;vertical-align:middle}
.banner{background:#123a24;border:1px solid var(--g);border-radius:10px;padding:10px;margin-bottom:10px}
.banner a{color:var(--g);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sel{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sel input{width:20px;height:20px;accent-color:var(--acc)}
.sel .p{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700}
.tot{}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button.on{background:var(--acc);color:#0b1118;border-color:var(--acc);font-weight:600}
.gl dt{font-weight:600;margin-top:8px}
.gl dd{margin:0;color:var(--mut);font-size:13px}
.leagues{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}
.leagues button{white-space:nowrap;border-radius:999px;padding:5px 11px;flex:none}
.leagues button.on{background:var(--acc);color:#0b1118;border-color:var(--acc);font-weight:600}
.leagues button small{opacity:.7;margin-left:3px}
.lg{font-size:11px;color:var(--mut);margin-bottom:4px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.filters summary{cursor:pointer;font-weight:600;font-size:14px}
.fl{margin-top:10px}
.fl>div:first-child{font-size:12px;color:var(--mut);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;padding:5px 10px;font-size:12px}
.chips button.on{background:var(--acc);color:#0b1118;border-color:var(--acc);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .p{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .p b{font-size:17px;display:block}
.rank{width:22px;color:var(--mut);font-size:12px;text-align:center;flex:none}
.day-s{display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;padding:6px 0}
.addbtn{padding:4px 9px;font-size:12px}
.tagq{font-size:10px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="row"><h1>Pronostici</h1><span class="sp"></span><button id="reload">↻</button></div>
  <div class="sub" id="upd">caricamento…</div>
  <div class="leagues" id="leagues"></div>
</header>
<main id="main"></main>
<nav>
  <button data-v="partite" class="on"><span>⚽</span>Partite</button>
  <button data-v="migliori"><span>⭐</span>Migliori</button>
  <button data-v="schedina"><span>🎫</span>Schedina</button>
  <button data-v="classifica"><span>📊</span>Classifica</button>
  <button data-v="info"><span>ℹ️</span>Guida</button>
</nav>
<script>
const REPO = "Trinka90/seriew-predictor";
const S = {view: "partite", pred: null, stand: null, meta: null, err: null, appUpdate: null, sel: null, mode: "corta",
           lega: (() => { try { return localStorage.getItem("lega") || "ALL"; } catch (e) { return "ALL"; } })()};
const LEGHE = () => S.pred?.leghe || {};
const lgName = c => LEGHE()[c] ? `${LEGHE()[c].flag} ${LEGHE()[c].nome}` : c;
const matches = () => (S.pred?.partite || []).filter(m => S.lega === "ALL" || (m.lega || "I1") === S.lega);
function setLega(c) { S.lega = c; S.sel = null; try { localStorage.setItem("lega", c); } catch (e) {} render(); window.scrollTo(0, 0); }
function leagueBar() {
  const all = S.pred?.partite || [];
  const cnt = c => all.filter(m => (m.lega || "I1") === c).length;
  const codes = Object.keys(LEGHE());
  if (S.view === "classifica") {
    const cur = S.lega === "ALL" ? "I1" : S.lega;
    return codes.filter(c => S.stand?.leghe?.[c]).map(c => `<button class="${c === cur ? "on" : ""}" onclick="setLega('${c}')">${lgName(c)}</button>`).join("");
  }
  return `<button class="${S.lega === "ALL" ? "on" : ""}" onclick="setLega('ALL')">Tutti<small>${all.length}</small></button>` +
    codes.map(c => `<button class="${c === S.lega ? "on" : ""}" onclick="setLega('${c}')">${lgName(c)}<small>${cnt(c)}</small></button>`).join("");
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc = p => p == null ? "–" : Math.round(p * 100) + "%";
const fair = p => p > 0 ? (1 / p).toFixed(2) : "–";
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];

/* ---------- traduzione dei mercati in parole semplici ---------- */
function label(k, m) {
  const c = m.casa, o = m.ospite;
  const L = {
    "1": `Vince ${c}`, "X": "Pareggio", "2": `Vince ${o}`,
    "1X": `${c} non perde`, "X2": `${o} non perde`, "12": "Non finisce in pareggio",
    "DNB 1": `${c} vince (rimborso se pari)`, "DNB 2": `${o} vince (rimborso se pari)`,
    "Handicap 1 (-1)": `${c} vince con 2+ gol di scarto`, "Handicap 2 (-1)": `${o} vince con 2+ gol di scarto`,
    "Over 0.5": "Almeno 1 gol", "Over 1.5": "Almeno 2 gol", "Over 2.5": "Almeno 3 gol",
    "Over 3.5": "Almeno 4 gol", "Over 4.5": "Almeno 5 gol",
    "Under 0.5": "Nessun gol", "Under 1.5": "Massimo 1 gol", "Under 2.5": "Massimo 2 gol",
    "Under 3.5": "Massimo 3 gol", "Under 4.5": "Massimo 4 gol",
    "GG": "Segnano entrambe", "NG": "Almeno una non segna",
    "Casa Over 0.5": `${c} segna`, "Casa Over 1.5": `${c} segna 2+ gol`,
    "Ospite Over 0.5": `${o} segna`, "Ospite Over 1.5": `${o} segna 2+ gol`,
    "1 + Over 1.5": `Vince ${c} e almeno 2 gol`, "2 + Over 1.5": `Vince ${o} e almeno 2 gol`,
    "1 + GG": `Vince ${c} e segnano entrambe`, "2 + GG": `Vince ${o} e segnano entrambe`,
    "GG + Over 2.5": "Segnano entrambe e almeno 3 gol",
    "1X + Under 3.5": `${c} non perde e max 3 gol`, "X2 + Under 3.5": `${o} non perde e max 3 gol`,
    "Pari": "Totale gol pari", "Dispari": "Totale gol dispari",
    "1T 1": `${c} avanti all'intervallo`, "1T X": "Pari all'intervallo", "1T 2": `${o} avanti all'intervallo`,
    "1T Over 0.5": "Almeno 1 gol nel 1° tempo", "1T Over 1.5": "Almeno 2 gol nel 1° tempo", "1T GG": "Segnano entrambe nel 1° tempo",
  };
  if (m.sport === "tennis") {
    const T = {"1": `Vince ${c}`, "2": `Vince ${o}`, "1 vince un set": `${c} vince almeno un set`, "2 vince un set": `${o} vince almeno un set`,
      "Set Over 2.5": "Si gioca il 3° set", "Set Over 3.5": "Si giocano almeno 4 set", "Set Over 4.5": "Si arriva al 5° set"};
    if (T[k]) return T[k];
    const r = k.match(/^Set (\d)-(\d)$/);
    if (r) return +r[1] > +r[2] ? `${c} vince ${r[1]}-${r[2]}` : `${o} vince ${r[2]}-${r[1]}`;
    return k;
  }
  if (m.sport === "basket") {
    let r;
    if (k === "1") return `Vince ${c}`;
    if (k === "2") return `Vince ${o}`;
    if ((r = k.match(/^(Over|Under) ([\d.]+) punti$/))) return `${r[1] === "Over" ? "Più" : "Meno"} di ${r[2]} punti totali`;
    if ((r = k.match(/^Handicap (casa|ospite) ([+-][\d.]+)$/))) {
      const t = r[1] === "casa" ? c : o, v = +r[2];
      return v < 0 ? `${t} vince con ${Math.ceil(-v)}+ punti di scarto` : `${t} vince o perde di massimo ${Math.floor(v)} punti`;
    }
    if ((r = k.match(/^(Casa|Ospite) vince di (\d+)\+$/))) return `${r[1] === "Casa" ? c : o} vince con ${r[2]}+ punti di scarto`;
    return k;
  }
  if (L[k]) return L[k];
  let r;
  if ((r = k.match(/^Multigol (\d)-(\d)$/))) return `Da ${r[1]} a ${r[2]} gol totali`;
  if ((r = k.match(/^PF (.)\/(.)$/))) { const t = x => x === "1" ? c : x === "2" ? o : "pari"; return `Intervallo ${t(r[1])}, finale ${t(r[2])}`; }
  if ((r = k.match(/^(Angoli|Cartellini) Over ([\d.]+)$/))) return `Più di ${Math.floor(+r[2])} ${r[1].toLowerCase()}`;
  return k;
}

/* ---------- pronostici giocabili di ogni partita, con categoria ---------- */
const CATS = {esito: "Vincente / 1X2", doppia: "Doppia chance", gol: "Over/Under gol", ggng: "Gol/NoGol",
              multigol: "Multigol", combo: "Combinati", set: "Set (tennis)", punti: "Punti (basket)", handicap: "Handicap"};
function catOf(k, m) {
  if (m.sport === "tennis") return (k === "1" || k === "2") ? "esito" : "set";
  if (m.sport === "basket") return (k === "1" || k === "2") ? "esito" : /punti$/.test(k) ? "punti" : "handicap";
  if (["1", "X", "2"].includes(k)) return "esito";
  if (["1X", "X2", "12"].includes(k)) return "doppia";
  if (/^(Over|Under) [1-4]\.5$/.test(k)) return "gol";
  if (k === "GG" || k === "NG") return "ggng";
  if (/^Multigol/.test(k)) return "multigol";
  if (/ \+ /.test(k)) return "combo";
  return null;
}
const CALCIO_KEYS = ["1", "X", "2", "1X", "X2", "12", "Over 1.5", "Over 2.5", "Over 3.5", "Under 1.5", "Under 2.5", "Under 3.5",
  "GG", "NG", "Multigol 1-3", "Multigol 2-4", "Multigol 2-3", "1 + Over 1.5", "2 + Over 1.5", "1 + GG", "2 + GG", "GG + Over 2.5"];
function picksFor(m, mi) {
  const keys = (!m.sport || m.sport === "calcio") ? CALCIO_KEYS : Object.keys(m.mercati);
  return keys.filter(k => m.mercati[k] != null && catOf(k, m)).map(k => {
    const p = m.mercati[k], q = m.quote?.[k] || null;
    return {id: `${mi}|${k}`, mi, m, k, p, cat: catOf(k, m), q, odd: q || 1 / p};
  });
}
function bestPick(m) {
  const all = picksFor(m, 0).filter(x => !["set", "handicap"].includes(x.cat) || m.sport !== "calcio");
  const c = all.filter(x => x.p >= .62 && x.p <= .88).sort((a, b) => b.p - a.p);
  return c[0] || all.sort((a, b) => b.p - a.p)[0];
}
function conf(p) { return p >= .8 ? ["c3", "Fiducia alta"] : p >= .7 ? ["c2", "Fiducia media"] : ["c1", "Fiducia bassa"]; }

/* frasi semplici sulla partita */
function storySport(m) {
  const M = m.mercati, out = [];
  const fav = M["1"] >= M["2"] ? [m.casa, M["1"]] : [m.ospite, M["2"]];
  out.push(fav[1] >= .75 ? `<b>${esc(fav[0])}</b> nettamente favorito (${pc(fav[1])}).` : fav[1] >= .6 ? `<b>${esc(fav[0])}</b> favorito (${pc(fav[1])}).` : `Partita <b>equilibrata</b>.`);
  if (m.sport === "tennis") {
    out.push(`🎾 ${esc(m.torneo)} · ${esc(m.turno)} · ${esc(m.superficie)}${m.bo5 ? " · al meglio dei 5 set" : ""}.`);
    out.push(`Rating Elo: ${esc(m.casa)} ${m.elo_casa} · ${esc(m.ospite)} ${m.elo_ospite}.`);
    if (m.pochi_dati) out.push(`⚠️ Pochi dati su uno dei due giocatori: pronostico meno affidabile.`);
  }
  if (m.sport === "basket") {
    out.push(`🏀 Punti attesi: ${esc(m.casa)} ${m.punti_casa} · ${esc(m.ospite)} ${m.punti_ospite}.`);
    if (m.con_mercato) out.push(`📈 Pronostico combinato con le quote dei bookmaker.`);
  }
  if (m.value.length) out.push(`💰 Quota conveniente: <b>${esc(label(m.value[0].mercato, m))}</b> pagata ${m.value[0].quota.toFixed(2)} (giusta ${fair(m.value[0].prob)}).`);
  return out;
}
function sportCard(m, i) {
  const M = m.mercati, bp = bestPick(m), [cc, ct] = conf(bp.p);
  const keys = Object.keys(M);
  return `<div class="card" id="c${i}">
  ${S.lega === "ALL" ? `<div class="lg">${lgName(m.lega)}</div>` : ""}
  <div class="teams"><b>${esc(m.casa)}</b><span class="vs">–</span><b>${esc(m.ospite)}</b><span class="sp"></span><span class="mut small">${esc(m.ora || "")}</span></div>
  <div class="meta">${form(m.forma_casa)} &nbsp;·&nbsp; ${form(m.forma_ospite)}</div>
  <div class="bar">
    <div style="width:${M["1"] * 100}%;background:var(--h)">${pc(M["1"])}</div>
    <div style="width:${M["2"] * 100}%;background:var(--a)">${pc(M["2"])}</div>
  </div>
  <div class="barlab"><span>vince ${esc(m.casa)}</span><span>vince ${esc(m.ospite)}</span></div>
  <div class="pick"><div><div class="mut small">Il pronostico più probabile</div><div class="t">${esc(label(bp.k, m))}</div><span class="conf ${cc}">${ct}</span></div>
    <div class="p"><b>${pc(bp.p)}</b><span class="mut small">${bp.q ? "paga " + bp.q.toFixed(2) : "quota giusta " + fair(bp.p)}</span></div></div>
  <ul class="says">${storySport(m).map(x => `<li>${x}</li>`).join("")}</ul>
  <button class="more" onclick="toggle(${i})">Tutti i pronostici ▾</button>
  <div class="det">${rows(m, keys)}</div></div>`;
}

function story(m) {
  const M = m.mercati, out = [];
  if (M["1"] >= .55) out.push(`<b>${esc(m.casa)}</b> è favorita (${pc(M["1"])} di vincere).`);
  else if (M["2"] >= .55) out.push(`<b>${esc(m.ospite)}</b> è favorita anche in trasferta (${pc(M["2"])}).`);
  else if (Math.abs(M["1"] - M["2"]) < .1) out.push(`Partita <b>equilibrata</b>: nessuna delle due è nettamente favorita.`);
  else out.push(`Leggermente avanti <b>${esc(M["1"] > M["2"] ? m.casa : m.ospite)}</b>, ma il pareggio è possibile (${pc(M["X"])}).`);
  const g = m.gol_casa + m.gol_ospite;
  out.push(g < 2.3 ? `Si aspettano <b>pochi gol</b> (circa ${g.toFixed(1)}).` : g > 2.9 ? `Si aspettano <b>molti gol</b> (circa ${g.toFixed(1)}).` : `Gol nella media (circa ${g.toFixed(1)}).`);
  const big = [...m.assenti_casa.map(a => [a, m.casa]), ...m.assenti_ospite.map(a => [a, m.ospite])]
    .filter(([a]) => a.importanza === "stella" || a.importanza === "titolare");
  if (big.length) out.push(`🚑 Pesano le assenze di ${big.slice(0, 4).map(([a, t]) => `<b>${esc(a.nome)}</b> (${esc(t)}${a.importanza === "stella" ? ", giocatore chiave" : ""}${a.certezza && a.certezza !== "certo" ? ", " + esc(a.certezza) : ""})`).join(", ")}.`);
  const ev = m.eventi || {};
  if (ev.porte_chiuse) out.push(`🔒 Si gioca a <b>porte chiuse</b>: meno vantaggio per chi gioca in casa.`);
  if (ev.campo_neutro) out.push(`🏟️ Si gioca in <b>campo neutro</b>: niente vantaggio casa.`);
  for (const [k, t] of [["casa", m.casa], ["ospite", m.ospite]]) {
    const e = ev[k] || {};
    if (e.turnover && e.turnover !== "nessuno") out.push(`🔄 ${esc(t)}: previsto turnover ${esc(e.turnover)}.`);
    if (e.nuovo_allenatore) out.push(`🧑‍💼 ${esc(t)}: nuovo allenatore.`);
  }
  const d = (m.gol_casa_notizie ?? m.gol_casa_base) + (m.gol_ospite_notizie ?? m.gol_ospite_base) - m.gol_casa_base - m.gol_ospite_base;
  if (Math.abs((m.gol_casa_notizie ?? m.gol_casa_base) - m.gol_casa_base) > .03 || Math.abs((m.gol_ospite_notizie ?? m.gol_ospite_base) - m.gol_ospite_base) > .03)
    out.push(`📰 Le notizie hanno cambiato i gol attesi: ${esc(m.casa)} ${m.gol_casa_base.toFixed(2)}→${m.gol_casa_notizie.toFixed(2)}, ${esc(m.ospite)} ${m.gol_ospite_base.toFixed(2)}→${m.gol_ospite_notizie.toFixed(2)}.`);
  if (m.con_mercato) out.push(`📈 Pronostico combinato con le quote dei bookmaker.`);
  if (!ev.n_titoli) {
    const hot = [...m.news_casa, ...m.news_ospite].filter(n => /infortunio|squalifica|allenatore/.test(n.tag || "")).length;
    if (hot) out.push(`⚠️ ${hot} notizie su infortuni/squalifiche/panchina non ancora analizzate: leggile prima di giocare.`);
  }
  if (m.value.length) out.push(`💰 Quota conveniente: <b>${esc(label(m.value[0].mercato, m))}</b> pagata ${m.value[0].quota.toFixed(2)} (giusta ${fair(m.value[0].prob)}).`);
  return out;
}

function candidates(skipDay) {
  const f = S.f, out = [];
  (S.pred?.partite || []).forEach((m, mi) => {

}

/* ---------- Schedina: costruzione automatica + modifica ---------- */
function autoBuild(cands, f) {
  const best = bestPerMatch(cands);
  if (f.obiettivo === "prob") return best.slice(0, f.n);
  // obiettivo quota: il minor numero di partite che raggiunge la quota (meno partite = meno margine del bookmaker)
  for (let k = 1; k <= f.n; k++) {
    const need = Math.pow(f.target, 1 / k);   // quota che serve in media a ogni pronostico
    const per = {};
    for (const x of cands) if (x.odd >= need && (!per[x.mi] || x.p > per[x.mi].p)) per[x.mi] = x;
    const pick = Object.values(per).sort((a, b) => b.p - a.p).slice(0, k);
    if (pick.length === k) return pick;
  }
  // ultima possibilità: i pronostici più probabili finché la quota basta
  const out = [];
  let q = 1;
  for (const x of best) { if (out.length >= f.n || q >= f.target) break; out.push(x); q *= x.odd; }
  return q >= f.target ? out : null;
}
function verdict(p, n) {
  return !n ? "Aggiungi almeno un pronostico." :
    p >= .5 ? "Buone possibilità: esce più di una volta su due." :
    p >= .25 ? `Possibile: esce circa 1 volta su ${Math.round(1 / p)}.` :
    p >= .1 ? `Difficile: esce circa 1 volta su ${Math.round(1 / p)}.` :
    `Molto difficile, quasi una lotteria: 1 volta su ${Math.round(1 / p)}.`;
}
function viewSchedina() {
  const f = S.f;
  const cands = candidates(false);
  if (!S.sel) { const a = autoBuild(cands, f); S.sel = a ? a.map(x => x.id) : []; S.autoFail = !a; }
  const byId = Object.fromEntries(cands.map(x => [x.id, x]));
  const chosen = S.sel.map(id => byId[id]).filter(Boolean);
  const used = new Set(chosen.map(x => x.mi));
  const others = bestPerMatch(cands.filter(x => !used.has(x.mi))).slice(0, 12);
  const p = chosen.reduce((a, x) => a * x.p, 1), n = chosen.length;
  const allReal = n && chosen.every(x => x.q);
  const odd = chosen.reduce((a, x) => a * x.odd, 1);
  const leagues = new Set(chosen.map(x => x.m.lega)).size;

  // schedine suggerite giorno per giorno (stessi filtri, giorno per giorno)
  const perDay = days().slice(0, 5).map(d => {
    const c = candidates(true).filter(x => x.m.data === d);
    const a = bestPerMatch(c).slice(0, Math.min(f.n, 4));
    return {d, a, p: a.reduce((s, x) => s * x.p, 1)};
  }).filter(x => x.a.length >= 2);

  return updBanner() + filtersPanel(true) + `
  <div class="card">
    <div class="fl" style="margin-top:0"><div>Come costruirla</div>
      <div class="seg"><button class="${f.obiettivo === "prob" ? "on" : ""}" onclick="setF('obiettivo','prob')">Massima probabilità</button>
      <button class="${f.obiettivo === "quota" ? "on" : ""}" onclick="setF('obiettivo','quota')">Raggiungi una quota</button></div></div>
    <div class="row" style="gap:16px;flex-wrap:wrap">
      <div class="step"><span class="small mut">${f.obiettivo === "prob" ? "Partite" : "Max partite"}</span>
        <button onclick="setF('n', Math.max(1, S.f.n - 1))">−</button><b>${f.n}</b><button onclick="setF('n', Math.min(12, S.f.n + 1))">+</button></div>
      ${f.obiettivo === "quota" ? `<div class="step"><span class="small mut">Quota totale</span>
        <select onchange="setF('target', +this.value)">${[1.5, 2, 2.5, 3, 4, 5, 7, 10, 15, 20].map(q => `<option value="${q}" ${f.target === q ? "selected" : ""}>${q}</option>`).join("")}</select></div>` : ""}
      <button onclick="S.sel=null;render()">↻ Ricalcola</button>
    </div>
  </div>
  ${S.autoFail && f.obiettivo === "quota" ? `<div class="banner" style="background:#3a3212;border-color:var(--y)">Con questi filtri non si arriva a quota ${f.target} con ${f.n} partite: aumenta le partite o abbassa la probabilità minima.</div>` : ""}
  <div class="card">
    <div class="row"><div><div class="mut small">Probabilità che esca tutta</div><div class="big">${n ? pc(p) : "–"}</div></div>
    <span class="sp"></span><div style="text-align:right"><div class="mut small">${n} pronostici · ${allReal ? "quota reale" : "quota giusta"}</div><div class="big">${n ? odd.toFixed(2) : "–"}</div></div></div>
    <div class="small">${verdict(p, n)}${leagues > 1 ? ` Mescola ${leagues} campionati/sport.` : ""}</div>
    ${chosen.map((x, i) => pickRow(x, null, `<input type="checkbox" checked onchange="S.sel=S.sel.filter(id=>id!=='${x.id}');render()" style="width:20px;height:20px;accent-color:var(--acc)">`)).join("")}
  </div>
  ${others.length ? `<div class="card"><div class="sec" style="margin-top:0">Altri pronostici che puoi aggiungere</div>
    ${others.map(x => pickRow(x, null, `<button class="addbtn" onclick="S.sel.push('${x.id}');render()">＋</button>`)).join("")}</div>` : ""}
  ${perDay.length ? `<div class="card"><div class="sec" style="margin-top:0">Schedine suggerite giorno per giorno</div>
    ${perDay.map(x => `<div class="prow"><div><b>${dayLabel(x.d)}</b><div class="small mut">${x.a.length} pronostici: ${x.a.map(y => esc(y.m.casa.split(" ").slice(-1)[0] + "–" + y.m.ospite.split(" ").slice(-1)[0])).join(", ")}</div></div>
      <div class="p"><b>${pc(x.p)}</b><button class="addbtn" onclick="setF('giorno','${x.d}')">Apri</button></div></div>`).join("")}</div>` : ""}
  <div class="card small"><b>Come leggerla.</b> Le probabilità si moltiplicano: 4 pronostici all'80% danno insieme il 41%, 10 danno l'11%.
  "Quota giusta" = quella senza guadagno del banco; se il bookmaker paga meno, la giocata non conviene. Ogni pronostico in più aggiunge il margine del bookmaker (circa 5%): per arrivare a una quota conviene usare meno partite. Gioca solo cifre che puoi permetterti di perdere.</div>`;
}

function viewClassifica() {
  const cur = S.lega === "ALL" ? "I1" : S.lega;
  const r = S.stand?.leghe?.[cur] || S.stand?.righe || [];
  if (!r.length) return `<div class="empty">Classifica non disponibile</div>`;
  const mx = Math.max(...r.map(x => x.forza ?? 0)), mn = Math.min(...r.map(x => x.forza ?? 0));
  const sp = LEGHE()[cur]?.sport && LEGHE()[cur].sport !== "calcio";
  return `<table><tr><th>#</th><th>${sp ? (LEGHE()[cur].sport === "tennis" ? "Giocatore" : "Squadra") : "Squadra"}</th><th>${sp ? "Elo" : "Punti"}</th><th>${sp ? "Partite" : "Gioc."}</th><th>Ultime 5</th><th>Forza reale</th></tr>${r.map(x =>
    `<tr><td>${x.pos}</td><td>${esc(x.squadra)}</td><td><b>${x.pt}</b></td><td>${x.pg}</td><td>${form(x.forma)}</td>
     <td><span class="fz" style="width:${x.forza == null ? 0 : 6 + 50 * (x.forza - mn) / ((mx - mn) || 1)}px"></span></td></tr>`).join("")}</table>
    <p class="mut small">V vittoria · N pareggio · P sconfitta. "Forza reale" è come il modello valuta la squadra guardando i gol fatti e subiti contro avversari di ogni livello, dando più peso alle partite recenti: una squadra può avere pochi punti ma essere forte (o il contrario).</p>`;
}

function viewInfo() {
  const m = S.meta || {};
  const bto = m.backtest || {};
  const bt = bto.stagione ? [["I1", bto]] : Object.entries(bto);
  const v = window.Android?.versionCode ? window.Android.versionCode() : null;
  return updBanner() + `
  ${bt.length ? `<div class="card"><h2>Quanto ci si può fidare</h2>
    <p class="small">Abbiamo fatto "giocare" il modello su tutta la stagione scorsa di ogni campionato, usando solo i dati disponibili prima di ogni giornata, e lo abbiamo confrontato con i bookmaker.</p>
    <table><tr><th></th><th>Campionato</th><th>Indovina<br>modello</th><th>Indovina<br>bookmaker</th><th>Quote<br>convenienti</th></tr>
    ${bt.map(([c, x]) => `<tr><td>${x.logloss_book == null ? "·" : x.logloss_modello <= x.logloss_book ? "✅" : "➖"}</td><td>${lgName(c)}</td><td>${pc(x.acc_modello)}</td><td>${pc(x.acc_book)}</td>
      <td style="color:${(x.roi ?? 0) >= 0 ? "var(--g)" : "var(--r)"}">${x.roi == null ? "–" : (x.roi >= 0 ? "+" : "") + (x.roi * 100).toFixed(1) + "%"}</td></tr>`).join("")}</table>
    <p class="small"><b>Queste cifre sono del solo modello.</b> Quando escono le quote (di solito 2-4 giorni prima della partita) il pronostico viene combinato con il mercato: nei test su 5.214 partite la precisione sale praticamente al livello dei bookmaker. Le partite combinate hanno la scritta 📈.</p>
    <p class="small">✅ = il modello è più preciso dei bookmaker in quel campionato. ➖ = un po' meno preciso: lì usalo per capire le partite, non come garanzia. "Quote convenienti" = guadagno o perdita simulati giocando solo dove il modello vedeva una quota alta.</p></div>` : ""}
  <div class="card"><h2>Come funziona</h2>
    <p class="small">1. Il modello studia le partite degli ultimi 3 anni (le recenti contano di più): gol e tiri in porta, per capire quanto ogni squadra attacca e difende e quanto pesa giocare in casa.<br>
    2. Un'intelligenza artificiale legge i titoli dei giornali dei giorni prima della partita (nella lingua del campionato) e trova assenti, squalificati, turnover, porte chiuse. Ogni assente pesa in base a ruolo e importanza: un attaccante chiave vale circa −10% di gol.<br>
    3. Quando escono le quote, il pronostico viene combinato con il mercato, che è la fonte più precisa che esista.<br>
    Da qui si calcola la probabilità di ogni risultato e di ogni pronostico. Tutto si aggiorna da solo 3 volte al giorno.</p></div>
  <div class="card gl"><h2>Glossario</h2><dl>
    <dt>1 · X · 2</dt><dd>Vince la squadra di casa · pareggio · vince la squadra ospite</dd>
    <dt>1X · X2</dt><dd>Doppia chance: la squadra non perde (vince o pareggia)</dd>
    <dt>Over / Under 2.5</dt><dd>Almeno 3 gol in totale / massimo 2 gol</dd>
    <dt>GG / NG</dt><dd>Goal-Goal: segnano entrambe / No Goal: almeno una non segna</dd>
    <dt>Multigol 2-4</dt><dd>Il totale dei gol è tra 2 e 4</dd>
    <dt>Quota giusta</dt><dd>1 diviso la probabilità. Se il bookmaker paga di più è una "quota conveniente"</dd>
    <dt>Tennis</dt><dd>Rating Elo per giocatore (generale e per superficie): misura la forza in base a chi hai battuto. Dalla probabilità di vittoria si calcolano anche i set.</dd>
    <dt>NBA</dt><dd>Rating Elo + punti fatti/subiti, combinati con le quote quando ci sono.</dd>
    <dt>Fiducia</dt><dd>Alta = 80% o più · Media = 70-80% · Bassa = sotto il 70%</dd>
  </dl></div>
  <div class="card"><h2>Dati</h2>
    <div class="kv"><span>Partite in archivio</span><b>${m.partite_storico ?? "–"}</b></div>
    <div class="kv"><span>Ultimo risultato registrato</span><b>${m.ultima_partita ?? "–"}</b></div>
    <div class="kv"><span>Notizie analizzate</span><b>${m.fonti?.notizie ?? "–"}</b></div>
    <div class="kv"><span>Lettura notizie con IA</span><b>${m.fonti?.ia?.attivo ? `attiva · ${esc(m.fonti.ia.fornitore || "")} · ${m.fonti.ia.partite ?? 0} partite` : "non attiva"}</b></div>
    <div class="kv"><span>Versione app</span><b>${v ?? "web"}</b></div>
    ${S.err ? `<div class="kv"><span>Errore</span><b>${esc(S.err)}</b></div>` : ""}
    <p class="mut small">Fonti: football-data.co.uk (calcio: risultati, statistiche, quote), fixturedownload.com (calendario), ESPN (tennis ATP/WTA e NBA, con quote NBA), Google News, Gazzetta, Corriere dello Sport (notizie).</p>
    <p class="mut small">Strumento statistico personale. Nessun pronostico è sicuro. Il gioco è vietato ai minori e può causare dipendenza.</p></div>`;
}

function updBanner() {
  const failed = S.meta?.stato === "errore" ? `<div class="banner" style="background:#3a3212;border-color:var(--y)">⚠️ L'ultimo aggiornamento non è riuscito (${esc(S.meta.errore || "")}). Stai vedendo i dati precedenti, che restano validi; si riprova da solo al prossimo giro.</div>` : "";
  return failed + (S.appUpdate ? `<div class="banner">Nuova versione dell'app disponibile. <a href="${esc(S.appUpdate.url)}">Scarica</a></div>` : "");
}
async function checkApp() {
  if (!window.Android?.versionCode || S.appUpdate) return;
  try {
    const r = await (await fetch(`https://api.github.com/repos/${REPO}/releases/latest`)).json();
    const latest = parseInt(String(r.tag_name || "").replace(/\D/g, "")) || 0;
    const apk = (r.assets || []).find(a => a.name.endsWith(".apk"));
    if (apk && latest > window.Android.versionCode()) { S.appUpdate = {url: apk.browser_download_url}; render(); }
  } catch (e) {}
}

function render() {
  $("#main").innerHTML = {partite: viewPartite, migliori: viewMigliori, schedina: viewSchedina, classifica: viewClassifica, info: viewInfo}[S.view]();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  const lb = $("#leagues");
  lb.style.display = ["info", "migliori", "schedina"].includes(S.view) ? "none" : "flex";
  lb.innerHTML = leagueBar();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.view = b.dataset.v; render(); window.scrollTo(0, 0); });
// ↻ ricarica anche l'interfaccia, non solo i dati
$("#reload").onclick = () => location.replace(location.pathname + "?t=" + Date.now());
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
